<nav class="bg-white dark:bg-slate-800 shadow">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
    <app-logo></app-logo>
    <button (click)="toggleMenu()" class="md:hidden text-2xl">
      <ion-icon [name]="menuOpen ? 'close' : 'menu'"></ion-icon>
    </button>
    <ul
      [class.hidden]="!menuOpen"
      class="absolute left-0 top-full w-full bg-white dark:bg-slate-800 z-20 flex flex-col gap-2 md:static md:flex-row md:gap-6 md:w-auto md:items-center md:space-x-6 md:mt-0 shadow md:shadow-none"
    >
      <li>
        <a routerLink="/home" class="flex items-center gap-1 px-4 py-2 hover:underline">
          <ion-icon name="home-outline"></ion-icon>
          Inicio
        </a>
      </li>
      <li *ngIf="token$ | async">
        <a routerLink="/subjects" class="flex items-center gap-1 px-4 py-2 hover:underline">
          <ion-icon name="book-outline"></ion-icon>
          Materias
        </a>
      </li>
      <li *ngIf="token$ | async">
        <a routerLink="/profile/view" class="flex items-center gap-1 px-4 py-2 hover:underline">
          <ion-icon name="person-circle-outline"></ion-icon>
          Perfil
        </a>
      </li>
      <li *ngIf="(token$ | async) === null">
        <a routerLink="/login" class="flex items-center gap-1 px-4 py-2 hover:underline">
          <ion-icon name="log-in-outline"></ion-icon>
          Entrar
        </a>
      </li>
      <li *ngIf="(token$ | async) === null">
        <a routerLink="/signup" class="flex items-center gap-1 px-4 py-2 hover:underline">
          <ion-icon name="person-add-outline"></ion-icon>
          Registro
        </a>
      </li>
      <li>
        <button (click)="toggleDarkMode()" class="flex items-center gap-1 w-full text-left px-4 py-2 hover:underline">
          <ion-icon [name]="isDark ? 'sunny-outline' : 'moon-outline'"></ion-icon>
          {{ isDark ? 'Claro' : 'Oscuro' }}
        </button>
      </li>
      <li *ngIf="token$ | async">
        <button (click)="logout()" class="flex items-center gap-1 w-full text-left px-4 py-2 hover:underline">
          <ion-icon name="log-out-outline"></ion-icon>
          Salir
        </button>
      </li>
    </ul>
  </div>
</nav>
