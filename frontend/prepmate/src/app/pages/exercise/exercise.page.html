<div class="min-h-screen bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark flex flex-col items-center px-3 py-16 gap-10">
  <app-logo></app-logo>
  <div class="w-96 max-w-full bg-white dark:bg-slate-800 px-5 py-4 rounded-2xl shadow-xl">
    <h2 class="text-2xl font-bold text-primary mb-6">Ejercicios - {{ materia }}</h2>
    <div *ngFor="let ex of exercises" class="mb-6">
      <p class="font-semibold mb-2">{{ ex.title }}</p>
      <ion-list>
        <ion-radio-group [(ngModel)]="selected[ex.id]">
          <ion-item *ngFor="let opt of ex.options | keyvalue">
            <ion-label>{{ opt.key }}. {{ opt.value }}</ion-label>
            <ion-radio slot="start" [value]="opt.key"></ion-radio>
          </ion-item>
        </ion-radio-group>
      </ion-list>
      <ion-button class="ion-button-custom mt-2" (click)="submit(ex)">Responder</ion-button>
    </div>
  </div>
</div>
