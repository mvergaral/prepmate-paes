<div class="min-h-screen bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark flex flex-col items-center px-3 py-16 gap-10">
  <app-logo></app-logo>

  <div class="w-96 max-w-full bg-white dark:bg-slate-800 px-5 py-4 rounded-2xl shadow-xl">
    <h1 class="text-2xl font-bold text-primary mb-6">Crear cuenta</h1>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <ion-item class="ion-item-custom">
        <ion-label position="floating" class="text-sm">Nombre</ion-label>
        <ion-input
          type="text"
          formControlName="name"
          class="ion-input-custom w-full text-text-light dark:text-white"
        ></ion-input>
      </ion-item>
      <div *ngIf="signupForm.get('name')?.invalid && signupForm.get('name')?.touched" class="text-xs text-red-500">Campo requerido</div>

      <ion-item class="ion-item-custom">
        <ion-label position="floating" class="text-sm">RUT</ion-label>
        <ion-input
          type="text"
          formControlName="rut"
          class="ion-input-custom w-full text-text-light dark:text-white"
        ></ion-input>
      </ion-item>
      <div *ngIf="signupForm.get('rut')?.invalid && signupForm.get('rut')?.touched" class="text-xs text-red-500">Campo requerido</div>

      <ion-item class="ion-item-custom">
        <ion-label position="floating" class="text-sm">Edad</ion-label>
        <ion-input
          type="number"
          formControlName="age"
          class="ion-input-custom w-full text-text-light dark:text-white"
        ></ion-input>
      </ion-item>
      <div *ngIf="signupForm.get('age')?.invalid && signupForm.get('age')?.touched" class="text-xs text-red-500">Campo requerido</div>

      <ion-item class="ion-item-custom">
        <ion-label position="floating" class="text-sm">Correo electrónico</ion-label>
        <ion-input
          type="email"
          formControlName="email"
          class="ion-input-custom w-full text-text-light dark:text-white"
        ></ion-input>
      </ion-item>
      <div *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched" class="text-xs text-red-500">Email inválido</div>

      <ion-item class="ion-item-custom">
        <ion-label position="floating" class="text-sm">Contraseña</ion-label>
        <ion-input
          type="password"
          formControlName="password"
          class="ion-input-custom w-full text-text-light dark:text-white"
        ></ion-input>
      </ion-item>
      <div *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched" class="text-xs text-red-500">Campo requerido</div>

      <ion-item class="ion-item-custom">
        <ion-label position="floating" class="text-sm">Confirmar contraseña</ion-label>
        <ion-input
          type="password"
          formControlName="confirmPassword"
          class="ion-input-custom w-full text-text-light dark:text-white"
        ></ion-input>
      </ion-item>
      <div *ngIf="signupForm.hasError('passwordMismatch') && signupForm.get('confirmPassword')?.touched" class="text-xs text-red-500">Las contraseñas no coinciden</div>

      <div class="flex items-center gap-2 text-sm text-text-muted">
        <input
          id="terms"
          type="checkbox"
          formControlName="terms"
          class="accent-primary focus:ring-primary"
        />
        <label for="terms" class="select-none">
          Acepto los <a href="#" class="text-primary underline">términos y condiciones</a>.
        </label>
      </div>

      <ion-button
        expand="block"
        type="submit"
        [disabled]="signupForm.invalid"
        class="ion-button-custom mt-4"
      >
        Registrarse
      </ion-button>

      <div class="text-sm text-center text-text-muted mt-4">
        ¿Ya tienes cuenta?
        <a [routerLink]="['/login']" class="underline text-primary">Inicia sesión</a>
      </div>

      <div class="mt-6 text-center text-sm text-text-muted">
        <a [routerLink]="['/home']" class="underline hover:text-primary transition">
          ← Volver al inicio
        </a>
      </div>
    </form>
  </div>
</div>
